# XcodeGen spec. Generate the project with:  xcodegen generate
# Requires: brew install xcodegen
name: HypeCheck
options:
  bundleIdPrefix: com.hypecheck
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  HypeCheckKit:
    path: .
  SwiftSoup:
    url: https://github.com/scinfu/SwiftSoup.git
    from: 2.7.0
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads.git
    from: 11.2.0

targets:
  HypeCheck:
    type: application
    platform: iOS
    sources:
      - path: App/HypeCheck
    dependencies:
      - package: HypeCheckKit
        product: HypeCheckKit
      - package: SwiftSoup
      - package: GoogleMobileAds
        product: GoogleMobileAds
      - target: HypeCheckShare
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hypecheck.app
        INFOPLIST_FILE: App/HypeCheck/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/HypeCheck/Resources/HypeCheck.entitlements
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_USER_SCRIPT_SANDBOXING: YES

  HypeCheckShare:
    type: app-extension
    platform: iOS
    sources:
      - path: App/HypeCheckShare
      - path: App/HypeCheck/Services/SharedStore.swift
    dependencies:
      - package: HypeCheckKit
        product: HypeCheckKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hypecheck.app.share
        INFOPLIST_FILE: App/HypeCheckShare/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/HypeCheckShare/HypeCheckShare.entitlements
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"

  HypeCheckTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/HypeCheckKitTests
    dependencies:
      - package: HypeCheckKit
        product: HypeCheckKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hypecheck.tests
